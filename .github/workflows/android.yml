name: APK

on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Capacitor
        run: npm ci

      - name: Copy the web bundle into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build and sign a release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p build
          cp android/app/build/outputs/apk/debug/app-debug.apk build/Oli-Commuter-debug.apk
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No KEYSTORE_BASE64 secret: publishing the debug build only."
            echo "A debug build installs fine; it just cannot be upgraded by a signed one."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          ( cd android && ./gradlew --no-daemon assembleRelease )
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          cd android/app/build/outputs/apk/release
          cp app-release-unsigned.apk "$GITHUB_WORKSPACE/build/Oli-Commuter-release.apk"
          "$BT/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            "$GITHUB_WORKSPACE/build/Oli-Commuter-release.apk"
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/build/Oli-Commuter-release.apk"

      - name: Checksums for in-app updates
        run: |
          cd build
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/*.apk*
          if-no-files-found: error

      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## ${V} " CHANGELOG.md; then
            echo "CHANGELOG.md has no \"## ${V}\" section — add the notes before tagging."
            exit 1
          fi
          {
            awk -v h="## ${V} " '
              index($0, h) == 1 { insec = 1; next }
              insec && /^## / { exit }
              insec { print }
            ' CHANGELOG.md
            printf '\n---\n\n**Install** `Oli-Commuter-debug.apk`: tap it, allow install from this app once, tap it again. Android 7.0 or newer.\n'
            if [ "$(printf '%s\n' "1.3.0" "$V" | sort -V | head -1)" = "1.3.0" ]; then
              printf '\nFrom this version on you can also update from inside the app: it checks this feed, downloads the new version, verifies the `.sha256` file next to the APK and hands it to the installer.\n'
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.apk
            build/*.sha256
          body_path: release-notes.md
